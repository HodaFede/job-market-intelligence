[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-intelligence"
version = "1.0.0"
description = "Collecte, nettoyage, NLP et analyse des offres d'emploi Data / IA en France, visualisées dans Tableau Public."
authors = [{ name = "Hoda Fede Ndinge" }]
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
jmi = "jmi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
